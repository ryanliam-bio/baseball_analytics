# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: About Me
    url: /
    weight: 10
  - name: Experience
    url: experience/
    weight: 20
  # Projects is a dropdown. Its label links to projects/ (Featured + All) through the navbar override in
  # layouts/_partials/components/headers/navbar.html; the chevron opens the list. Category pages live in
  # content/topics/ and filter on each project's `categories:` (values use "and", never "&").
  # Children are listed alphabetically (Liam, Nov 19).
  - name: Projects
    identifier: projects
    url: projects/
    weight: 30
  - name: Biomechanics
    url: topics/biomechanics/
    parent: projects
    weight: 2
  - name: Projections & Modeling
    url: topics/projections-modeling/
    parent: projects
    weight: 3
  - name: Statcast Analysis
    url: topics/statcast-analysis/
    parent: projects
    weight: 4
  - name: Awards
    url: topics/awards/
    parent: projects
    weight: 1
